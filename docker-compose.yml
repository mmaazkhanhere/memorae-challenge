services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memorae
      POSTGRES_USER: memorae
      POSTGRES_PASSWORD: memorae
    ports:
      - "5433:5432"
    volumes:
      - memorae_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorae -d memorae"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memorae_test
      POSTGRES_USER: memorae
      POSTGRES_PASSWORD: memorae
    ports:
      - "5434:5432"
    volumes:
      - memorae_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorae -d memorae_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memorae:memorae@postgres:5432/memorae
    command: ["uv", "run", "--no-dev", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memorae:memorae@postgres:5432/memorae
    command:
      ["uv", "run", "--no-dev", "uvicorn", "reminder_agent.application.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://memorae:memorae@postgres:5432/memorae
    command: ["uv", "run", "--no-dev", "reminder-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  memorae_postgres_data:
  memorae_postgres_test_data:
