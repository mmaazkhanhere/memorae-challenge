[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project]
name = "reminder-agent"
version = "0.1.0"
description = "Memorae reminder and memory agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "colorama>=0.4.6,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "phonenumbers>=9.0,<10",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[tool.mypy]
python_version = "3.12"
files = ["src/reminder_agent"]
incremental = true
cache_dir = ".mypy_cache"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[project.scripts]
reminder-agent = "reminder_agent.application.main:run"
reminder-worker = "reminder_agent.infrastructure.runtime.worker:run"
memory-embedding-backfill = "reminder_agent.features.memory.backfill:run"
